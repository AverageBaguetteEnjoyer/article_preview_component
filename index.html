<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Article preview component | solution to the Frontend Mentor challenge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article preview component</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main>
        <article class="article">
            <img class="article__illustration" src="./images/drawers.jpg" alt="">
            <div class="article__content">
                <h1>
                    <a href="#">Shift the overall look and feel by adding these wonderful touches to furniture in your home</a>
                </h1>
                <p>Ever been in a room and felt like something was missing? Perhaps it felt slightly bare and uninviting. I’ve got some simple tips to help you make any room feel complete.</p>
                <footer class="article__footer">
                    <div class="article__author">
                        <img class="article__author-avatar" src="./images/avatar-michelle.jpg" alt="Michelle Appleton">
                        <div class="article__author-inner">
                            <a class="article__author-profile-link" href="#">Michelle Appleton</a>
                            <time class="article__author-date" datetime="2020-06-28">28 Jun 2020</time>
                        </div>
                    </div>
                    <button class="article__share-btn" data-share-btn aria-label="Share this article" aria-haspopup="true" aria-expanded="false" aria-controls="share-popup">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="13"><path fill="#6E8098" d="M15 6.495L8.766.014V3.88H7.441C3.33 3.88 0 7.039 0 10.936v2.049l.589-.612C2.59 10.294 5.422 9.11 8.39 9.11h.375v3.867L15 6.495z"/></svg>
                    </button>
                </footer>
            </div>
            <div id="share-popup" data-share-popup class="article__share-popup">
                <span>Share</span>
                <ul class="article__share-links">
                    <li>
                        <a href="#" aria-label="Share on Facebook">
                            <img src="./images/icon-facebook.svg" alt="">
                        </a>
                    </li>
                    <li>
                        <a href="#" aria-label="Share on Twitter">
                            <img src="./images/icon-twitter.svg" alt="">
                        </a>
                    </li>
                    <li>
                        <a href="#" aria-label="Share on Pinterest">
                            <img src="./images/icon-pinterest.svg" alt="">
                        </a>
                    </li>
                </ul>
            </div>
        </article>
    </main>
    <script src="./script.js"></script>
</body>
</html>
